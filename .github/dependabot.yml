version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # Dependency updates are integrated like any other change and reach main through release.
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: America/Mexico_City
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      angular:
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - '@angular-eslint/*'
          - 'angular-eslint'
      dev-tooling:
        dependency-type: development
        # Angular dev packages (compiler-cli, build, cli) must move with the angular group: they need the exact same version.
        exclude-patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - '@angular-eslint/*'
          - 'angular-eslint'
    ignore:
      # Angular and TypeScript majors need `ng update` migrations, done manually in a personal branch.
      - dependency-name: '@angular/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: America/Mexico_City
    commit-message:
      prefix: chore(deps)
