# SonarQube Cloud: https://sonarcloud.io/project/overview?id=JulianH2_itacr-frontend
# Read by .github/workflows/sonarqube.yml. The token is the SONAR_TOKEN secret, never this file.
sonar.projectKey=JulianH2_itacr-frontend
sonar.organization=julianh2

# The app, the static server, the scripts of public/, and the workflows are analyzed; the specs are tests.
sonar.sources=src,server,public,.github
sonar.tests=src,server
sonar.test.inclusions=src/**/*.spec.ts,server/**/*.test.cjs
sonar.exclusions=src/**/*.spec.ts,server/**/*.test.cjs,public/assets/**

# Coverage from Vitest (npm run test:coverage). The static server is covered by node --test, which writes no lcov, and the
# testing helpers are not product code.
sonar.javascript.lcov.reportPaths=coverage/itacr-frontend/lcov.info
sonar.coverage.exclusions=src/**/testing/**,server/**,public/**,.github/**
