name: Deploy

# main deploys production and release deploys QA (build configuration qa, which points to the QA API).
on:
  push:
    branches: [main, release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  AZURE_WEBAPP_NAME: ${{ github.ref_name == 'main' && 'app-itacr-frontend-prod' || 'app-itacr-frontend-qa' }}
  AZURE_RESOURCE_GROUP: rg-itacr-prod-westus
  BUILD_SCRIPT: ${{ github.ref_name == 'main' && 'build' || 'build:qa' }}
  BUILD_OUTPUT: dist/itacr-frontend/browser

jobs:
  build:
    if: github.ref_name == 'main' || github.ref_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: 0
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run "$BUILD_SCRIPT"

      - name: Test the static server
        run: npm run test:server

      # App Service runs this file instead of pm2 serve, to send the security headers (ITACR-57).
      - name: Add the static server to the build
        run: cp server/server.cjs "$BUILD_OUTPUT/server.cjs"

      - name: Check the build output
        run: test -f "$BUILD_OUTPUT/index.html" && test -f "$BUILD_OUTPUT/ngsw.json" && test -f "$BUILD_OUTPUT/server.cjs"

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: browser
          path: ${{ env.BUILD_OUTPUT }}
          if-no-files-found: error
          retention-days: 3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: browser
          path: browser

      # OIDC, no publish profile: the service principal has Website Contributor on the two frontend App Services only.
      - name: Sign in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          resource-group-name: ${{ env.AZURE_RESOURCE_GROUP }}
          package: browser
