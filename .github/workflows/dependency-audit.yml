name: Dependency Audit

# Reports known vulnerabilities in the npm dependencies (ITACR-75). It only warns: the job never fails the PR, because
# a vulnerability in a transitive package often has no fix yet. Dependabot opens the update PRs when a fix exists.
on:
  pull_request:
    branches: ['sprint-*', develop, release, main]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --audit-level=high > audit.txt || true
          cat audit.txt
          if grep -qE '[0-9]+ (high|critical)' audit.txt; then
            echo "::warning title=Vulnerable dependencies::npm audit found high or critical vulnerabilities. See the job log."
          fi
