<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="utf-8" />
    <!--
      Content Security Policy (ITACR-66). The 'unsafe-inline' of style-src is required by Angular: it injects the styles
      of the components at runtime as <style> elements, and the browser only accepts them with 'unsafe-inline' or with a
      nonce that a server generates for every answer (Angular's CSP_NONCE). The app is served as static files, so that
      nonce does not exist yet; script-src has no 'unsafe-inline', so an injected style cannot run code.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://app-itacr-backend-prod-b3hvcggncghafbgp.westus-01.azurewebsites.net; connect-src 'self' https://app-itacr-backend-prod-b3hvcggncghafbgp.westus-01.azurewebsites.net wss://app-itacr-backend-prod-b3hvcggncghafbgp.westus-01.azurewebsites.net https://fonts.googleapis.com https://fonts.gstatic.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <title>ITACR</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Gestión de pedidos para restaurantes de comida rápida" />
    <meta name="theme-color" content="#5a3e37" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1715" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <script src="theme-init.js"></script>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ITACR" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root>
      <div class="splash" role="status">
        <span class="splash__logo">
          <img src="icons/logo-mark.png" alt="" width="72" height="72" />
        </span>
        <p class="splash__name">ITACR</p>
        <p class="splash__tagline">Gestión para restaurantes de comida rápida</p>
        <span class="splash__dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="sr-only">Cargando ITACR…</span>
      </div>
    </app-root>
    <noscript>Activa JavaScript para usar ITACR.</noscript>
  </body>
</html>
