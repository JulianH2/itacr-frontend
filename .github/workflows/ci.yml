name: CI

on:
  pull_request:
    branches: ['sprint-*', develop, release, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-name:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate source and target branches
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          KEBAB='[a-z0-9]+(-[a-z0-9]+)*'
          PERSONAL="^(feature|fix|docs|refactor|test|chore)/ITACR-[0-9]+-${KEBAB}$"
          HOTFIX="^hotfix/ITACR-[0-9]+-${KEBAB}$"
          SPRINT='^sprint-[0-9]{2,}$'
          DEPENDABOT='^dependabot/.+$'
          RELEASE_PLEASE='^release-please--.+$'

          allowed=false
          case "$BASE_REF" in
            sprint-*)
              if [[ "$HEAD_REF" =~ $PERSONAL ]]; then allowed=true; fi
              ;;
            develop)
              # Dependabot is allowed because its weekly update PRs target develop.
              if [[ "$HEAD_REF" =~ $SPRINT || "$HEAD_REF" =~ $HOTFIX || "$HEAD_REF" =~ $DEPENDABOT ]]; then allowed=true; fi
              ;;
            release)
              if [[ "$HEAD_REF" == "develop" || "$HEAD_REF" == "main" ]]; then allowed=true; fi
              ;;
            main)
              if [[ "$HEAD_REF" == "release" || "$HEAD_REF" =~ $HOTFIX || "$HEAD_REF" =~ $RELEASE_PLEASE ]]; then allowed=true; fi
              ;;
          esac

          if [[ "$allowed" == "true" ]]; then
            echo "OK: '$HEAD_REF' -> '$BASE_REF'"
            exit 0
          fi

          echo "::error title=Branch flow not allowed::'$HEAD_REF' cannot open a PR into '$BASE_REF'. See the allowed flow below and CONTRIBUTING.md, section 2."
          cat <<'EOF'
          Allowed flow (target <- source):
            sprint-XX <- <type>/ITACR-<N>-<kebab-description>   (type: feature, fix, docs, refactor, test, chore)
            develop   <- sprint-XX | hotfix/ITACR-<N>-<kebab-description> (back-merge) | dependabot/*
            release   <- develop | main (back-merge after a release)
            main      <- release | hotfix/ITACR-<N>-<kebab-description> | release-please--*
          The description after the Jira key is lowercase kebab-case: letters, numbers, and single hyphens.
          Example: feature/ITACR-7-pin-login -> sprint-01
          EOF
          exit 1

  # Local hooks can be skipped, so the commit convention is also checked here, with the same commitlint rules (ITACR-64).
  # Only for personal branches into sprint-XX: flow PRs carry merge commits and the release-please commit.
  commit-messages:
    if: startsWith(github.base_ref, 'sprint-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HUSKY: 0
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # commitlint ignores the merge commits that git writes by itself.
      - name: Validate every commit message in the PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm exec --no -- commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Git hooks are only useful on developer machines.
      HUSKY: 0
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # The same run measures the coverage (ITACR-62), so the tests do not run twice. There is no minimum yet.
      - name: Run unit tests with coverage
        run: npm run test:coverage

      # Shows the percentage of covered lines in the summary of the job, also when a test failed.
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: node .github/scripts/coverage-summary.cjs coverage/itacr-frontend/coverage-summary.json

      - name: Test the static server
        run: npm run test:server

      - name: Build
        run: npm run build
