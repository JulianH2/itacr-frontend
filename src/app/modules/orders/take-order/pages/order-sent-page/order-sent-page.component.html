<main class="sent">
  @if (store.sentOrder(); as order) {
    <section class="sent__card" role="status" aria-live="polite">
      <span class="sent__check" aria-hidden="true">
        <app-icon name="check" [size]="56" />
      </span>
      <h1 class="sent__title">¡Pedido enviado a cocina!</h1>
      <p class="sent__number tabular">Orden #{{ order.orderNumber }}</p>
      <p class="sent__destination">
        {{ order.tableNumber !== null ? 'Mesa ' + order.tableNumber : 'Para llevar' }}
      </p>
      <p class="sent__total tabular">Total: {{ order.total | mxnPrice }}</p>
    </section>

    <div class="sent__actions">
      <button type="button" mat-flat-button class="sent__new" (click)="startNewOrder()">
        Tomar nuevo pedido
      </button>
      <a mat-stroked-button class="sent__new" [routerLink]="['/orders/detail', order.id]">
        Ver detalle
      </a>
    </div>
  }
</main>
