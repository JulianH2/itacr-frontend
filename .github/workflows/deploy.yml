name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AZURE_WEBAPP_NAME: app-itacr-frontend-prod
  BUILD_OUTPUT: dist/itacr-frontend/browser

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: 0
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build for production
        run: npm run build

      - name: Check the build output
        run: test -f "$BUILD_OUTPUT/index.html" && test -f "$BUILD_OUTPUT/ngsw.json"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: browser
          path: ${{ env.BUILD_OUTPUT }}
          if-no-files-found: error
          retention-days: 3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: browser
          path: browser

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_FRONTEND_PUBLISH_PROFILE }}
          package: browser
