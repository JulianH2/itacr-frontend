name: CI

on:
  pull_request:
    branches: ['sprint-*', develop, release, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-name:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate source and target branches
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          KEBAB='[a-z0-9]+(-[a-z0-9]+)*'
          case "$BASE_REF" in
            sprint-*)
              pattern="^(feature|fix|docs|refactor|test|chore)/ITACR-[0-9]+-${KEBAB}$"
              expected='<type>/ITACR-<N>-<short-description> (type: feature, fix, docs, refactor, test, chore)'
              ;;
            develop)
              pattern='^(sprint-[0-9]{2,}|main|sync/main-into-develop|dependabot/.+)$'
              expected='sprint-XX, or main for a back-merge'
              ;;
            release)
              pattern='^(develop|main|sync/main-into-release)$'
              expected='develop, or main for a back-merge'
              ;;
            main)
              pattern="^(release|hotfix/ITACR-[0-9]+-${KEBAB}|release-please--.+)$"
              expected='release, hotfix/ITACR-<N>-<short-description>, or the release-please branch'
              ;;
            *)
              echo "No branch rules for target '$BASE_REF'."
              exit 0
              ;;
          esac

          if [[ "$HEAD_REF" =~ $pattern ]]; then
            echo "OK: '$HEAD_REF' -> '$BASE_REF'"
          else
            echo "::error::Branch '$HEAD_REF' cannot open a PR into '$BASE_REF'. Expected: $expected. See CONTRIBUTING.md, section 2."
            exit 1
          fi

  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Git hooks are only useful on developer machines.
      HUSKY: 0
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build
